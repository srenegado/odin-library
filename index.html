<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="new-book-wrapper">
    <button class="new-book-button">New Book</button>
  </div>
  
  <dialog class="new-book-modal">
    <form action="" class="new-book-form" method="dialog">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" required>
      <label for="author">Author</label>
      <input type="text" id="author" name="author" required>
      <label for="pages">Pages</label>
      <input type="number" id="pages" name="pages" required>
      <fieldset>
        <legend>Have you read the book?</legend>
        <input type="radio" name="read" id="have-read" value="true" checked>
        <label for="have-read">Have read</label>
        <input type="radio" name="read" id="not-read-yet" value="false">
        <label for="not-read-yet">Not read yet</label>   
      </fieldset> 
      <button class="add-book-button">Add book</button> 
    </form>
  </dialog>
   
  <div class="book-list">
    
  </div>

  <script src="library.js"></script>
</body>
</html>
